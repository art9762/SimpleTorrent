name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: node --check app/static/app.js
      - run: python -m compileall -q app scripts
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y transmission-daemon
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/test_integration.py
        env: { ST_INTEGRATION: "1" }
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: tests/browser/package-lock.json }
      - run: pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npm test
        working-directory: tests/browser
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: transmission
          platforms: linux/amd64,linux/arm64
          push: false
      - run: python3 scripts/setup.py --generate > /dev/null
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 120
      - run: curl --fail http://localhost:8080/healthz
      - if: always()
        run: docker compose logs && docker compose down
